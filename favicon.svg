<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hintergrund Gradient -->
    <linearGradient id="aegis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Schild/Sprechblase Icon Gradient -->
    <linearGradient id="aegis-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Subtiles Glühen / Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Abgerundeter Hintergrund für das Favicon -->
  <rect width="512" height="512" rx="112" fill="url(#aegis-bg)" />

  <!-- Äußerer feiner Glow-Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#aegis-shield-grad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Hauptsymbol: Aegis-Schild kombiniert mit Sprechblasen-Nase -->
  <g filter="url(#glow)">
    <!-- Schildform mit integrierter Sprechblasen-Ecke unten links -->
    <path d="M 256,96 
             C 340,96 384,112 384,112 
             V 240 
             C 384,328 304,384 256,416 
             C 208,384 128,328 128,240 
             V 112 
             S 172,96 256,96 Z" 
          fill="url(#aegis-shield-grad)" />

    <!-- Innere Aussparung für Schloss / Keyhole Akzent (Sicherheit) -->
    <path d="M 256,176 
             C 238.3,176 224,190.3 224,208 
             C 224,220.8 231.5,231.9 242.3,237.1 
             L 236,288 
             H 276 
             L 269.7,237.1 
             C 280.5,231.9 288,220.8 288,208 
             C 288,190.3 273.7,176 256,176 Z" 
          fill="#0b0f19" />
  </g>
</svg>
